<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safonee - الملف الشخصي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <header class="top-bar">
        <div class="logo-small" onclick="window.location.href='home.html'" style="cursor:pointer">
            <span class="logo-icon">◈</span>
            <h2>Safonee</h2>
        </div>
        <div class="user-actions">
            <button class="icon-btn" onclick="window.location.href='home.html'">🏠</button>
            <button class="icon-btn" onclick="window.location.href='chat.html'">💬</button>
            <button class="icon-btn" onclick="toggleDarkMode()">🌙</button>
            <div class="avatar">أ</div>
        </div>
    </header>

    <div class="profile-container">
        <!-- غلاف الملف الشخصي -->
        <div class="profile-cover">
            <div class="cover-photo"></div>
            <div class="profile-avatar-large">أ</div>
        </div>

        <!-- معلومات الملف -->
        <div class="profile-info">
            <h1 id="profileName">أحمد محمد</h1>
            <p class="profile-bio">مطور ويب | محب للتقنية | عاشق للبرمجة 💻</p>
            <div class="profile-stats">
                <div class="stat"><strong id="profilePosts">0</strong><span>منشور</span></div>
                <div class="stat"><strong>1,234</strong><span>متابع</span></div>
                <div class="stat"><strong>890</strong><span>يتابع</span></div>
            </div>
            <div class="profile-actions">
                <button class="btn-edit" onclick="editProfile()">✏️ تعديل الملف</button>
                <button class="btn-share" onclick="shareProfile()">🔗 مشاركة</button>
            </div>
        </div>

        <!-- تبويبات -->
        <div class="profile-tabs">
            <button class="tab active" onclick="showTab('posts', this)">📝 المنشورات</button>
            <button class="tab" onclick="showTab('photos', this)">📸 الصور</button>
            <button class="tab" onclick="showTab('about', this)">ℹ️ حول</button>
        </div>

        <!-- محتوى التبويبات -->
        <div class="tab-content">
            <div id="posts-tab" class="tab-panel active">
                <div id="profilePostsContainer"></div>
            </div>
            <div id="photos-tab" class="tab-panel">
                <div class="photos-grid" id="photosGrid"></div>
            </div>
            <div id="about-tab" class="tab-panel">
                <div class="about-section">
                    <h3>معلومات شخصية</h3>
                    <div class="info-item">📧 البريد: ahmed@safonee.com</div>
                    <div class="info-item">📍 الموقع: العراق</div>
                    <div class="info-item">💼 العمل: مطور ويب</div>
                    <div class="info-item"> التعليم: جامعة بغداد</div>
                    <div class="info-item">📅 انضم: أكتوبر 2026</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadProfilePosts();
        };

        function loadProfilePosts() {
            var posts = JSON.parse(localStorage.getItem('safonee_posts') || '[]');
            var container = document.getElementById('profilePostsContainer');
            var photosGrid = document.getElementById('photosGrid');
            container.innerHTML = '';
            photosGrid.innerHTML = '';

            var myPosts = posts.filter(p => p.author === 'أنت');
            document.getElementById('profilePosts').textContent = myPosts.length;

            if (myPosts.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد منشورات بعد. ابدأ بنشر شيء! 🚀</div>';
                photosGrid.innerHTML = '<div class="empty-state">لا توجد صور بعد 📷</div>';
                return;
            }

            myPosts.forEach(function(post) {
                // عرض المنشورات
                var imageHTML = post.image ? `<div class="post-image-container"><img src="${post.image}" class="post-image"></div>` : '';
                var html = `
                    <article class="post">
                        <div class="post-header">
                            <div class="avatar-small">أ</div>
                            <div class="post-info">
                                <h4>أنت</h4>
                                <span>${post.time} · 🌍</span>
                            </div>
                        </div>
                        ${post.content ? `<p class="post-content">${post.content}</p>` : ''}
                        ${imageHTML}
                        <div class="post-actions">
                            <button>❤️ ${post.likes}</button>
                            <button>💬 ${post.comments.length}</button>
                            <button onclick="deletePost(${post.id})">🗑️ حذف</button>
                        </div>
                    </article>
                `;
                container.innerHTML += html;

                // عرض الصور في تبويب الصور
                if (post.image) {
                    photosGrid.innerHTML += `<div class="photo-item"><img src="${post.image}" onclick="openImageModal('${post.image}')"></div>`;
                }
            });

            if (photosGrid.innerHTML === '') {
                photosGrid.innerHTML = '<div class="empty-state">لا توجد صور بعد </div>';
            }
        }

        function deletePost(postId) {
            if (confirm('هل تريد حذف هذا المنشور؟')) {
                var posts = JSON.parse(localStorage.getItem('safonee_posts') || '[]');
                posts = posts.filter(p => p.id !== postId);
                localStorage.setItem('safonee_posts', JSON.stringify(posts));
                loadProfilePosts();
            }
        }

        function showTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        function editProfile() {
            var newName = prompt('أدخل اسمك الجديد:', document.getElementById('profileName').textContent);
            if (newName) {
                document.getElementById('profileName').textContent = newName;
                localStorage.setItem('profileName', newName);
                alert('تم تحديث الاسم! ✅');
            }
        }

        function shareProfile() {
            alert('تم نسخ رابط الملف الشخصي! 🔗');
        }

        function openImageModal(src) {
            var modal = document.createElement('div');
            modal.className = 'image-modal';
            modal.onclick = function() { this.remove(); };
            modal.innerHTML = `<img src="${src}" style="max-width:90%; max-height:90%; border-radius:12px;">`;
            document.body.appendChild(modal);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <style>
        .profile-container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        .profile-cover {
            position: relative;
            height: 250px;
            background: linear-gradient(135deg, #6366f1, #2d2d30);
        }
        .profile-avatar-large {
            position: absolute;
            bottom: -50px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: white;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: #6366f1;
        }
        .profile-info {
            padding: 60px 30px 20px;
            text-align: center;
        }
        .profile-info h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .profile-bio {
            color: #666;
            margin-bottom: 20px;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }
        .stat {
            text-align: center;
        }
        .stat strong {
            display: block;
            font-size: 1.5rem;
            color: #2d2d30;
        }
        .stat span {
            color: #888;
            font-size: 0.9rem;
        }
        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn-edit, .btn-share {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-edit {
            background: #6366f1;
            color: white;
        }
        .btn-share {
            background: #f5f5f7;
            color: #2d2d30;
        }
        .profile-tabs {
            display: flex;
            border-top: 1px solid #e8e8ec;
            border-bottom: 1px solid #e8e8ec;
            margin-top: 20px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }
        .tab-panel {
            display: none;
            padding: 20px;
        }
        .tab-panel.active {
            display: block;
        }
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .photo-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .about-section {
            padding: 20px;
        }
        .about-section h3 {
            margin-bottom: 15px;
        }
        .info-item {
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f7;
            color: #444;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1rem;
        }
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
    </style>
</body>
</html>
