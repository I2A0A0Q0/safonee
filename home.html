<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>safontee - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>safontee</h1>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div class="form-box login active" id="loginForm">
            <h2>تسجيل الدخول</h2>
            <form>
                <div class="input-group">
                    <input type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="كلمة المرور" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
                <div class="links">
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>
            </form>
            <div class="switch-text">
                <p>ليس لديك حساب؟ <a href="#" id="showRegister">إنشاء حساب جديد</a></p>
            </div>
        </div>

        <!-- نموذج إنشاء حساب -->
        <div class="form-box register" id="registerForm">
            <h2>إنشاء حساب جديد</h2>
            <form>
                <div class="input-group">
                    <input type="text" placeholder="الاسم الكامل" required>
                    <i class="fas fa-id-card"></i>
                </div>
                <div class="input-group">
                    <input type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="كلمة المرور" required>
                    <i class="fas fa-lock"></i>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="تأكيد كلمة المرور" required>
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" class="btn-primary">إنشاء حساب</button>
            </form>
            <div class="switch-text">
                <p>لديك حساب بالفعل؟ <a href="#" id="showLogin">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
