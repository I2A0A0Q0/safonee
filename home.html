<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safonee - الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="NyupvUuVcfA1qILuoCXQUAfo5yM9X4PHXd39SZ7uKg0" />
</head>
<body class="home-page">
    <header class="top-bar">
        <div class="logo-small">
            <span class="logo-icon">◈</span>
            <h2>Safonee</h2>
        </div>
        <div class="search-box">
            <input type="text" placeholder="🔍 ابحث في Safonee...">
        </div>
                <div class="user-actions">
            <button class="icon-btn" onclick="alert('لا توجد إشعارات جديدة')">🔔</button>
            <button class="icon-btn" onclick="window.location.href='chat.html'">💬</button>
            <button class="icon-btn" onclick="toggleDarkMode()">🌙</button>
            <div class="avatar" onclick="window.location.href='profile.html'">أ</div>
        </div>
            <div class="avatar" onclick="logout()">أ</div>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar-right">
            <div class="profile-card">
                <div class="avatar-large">أ</div>
                <h3 id="userName">أحمد محمد</h3>
                <p class="bio">مطور ويب | محب للتقنية</p>
                <div class="stats">
                    <div><strong id="postCount">0</strong><span>منشور</span></div>
                    <div><strong>1.2K</strong><span>متابع</span></div>
                    <div><strong>890</strong><span>يتابع</span></div>
                </div>
            </div>
            <nav class="menu">
                <a href="#" class="active">🏠 الرئيسية</a>
                <a href="#">👥 الأصدقاء</a>
                <a href="#">📸 الصور</a>
                <a href="#">🎥 الفيديو</a>
                <a href="#">⚙️ الإعدادات</a>
            </nav>
        </aside>

        <main class="feed">
            <div class="create-post">
                <div class="avatar-small">أ</div>
                <div class="post-input-wrapper">
                    <input type="text" id="postInput" placeholder="بماذا تفكر الآن؟">
                    <div id="imagePreviewContainer" style="display:none; position:relative; margin-top:10px;">
                        <img id="previewImg" style="width:100%; border-radius:12px; max-height:300px; object-fit:cover;">
                        <button onclick="removeImage()" style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:white; border:none; width:35px; height:35px; border-radius:50%; cursor:pointer; font-size:1.2rem;">✕</button>
                    </div>
                    <div class="post-options">
                        <label class="option-btn">
                            📷 صورة
                            <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
                        </label>
                        <button class="option-btn" onclick="alert('قريباً!')">😊 إيموجي</button>
                    </div>
                </div>
                <button class="btn-post" onclick="createPost()">نشر</button>
            </div>

            <div id="postsContainer"></div>
        </main>

        <aside class="sidebar-left">
            <div class="widget">
                <h3>اقتراحات للأصدقاء</h3>
                <div class="friend-suggestion">
                    <div class="avatar-small">ل</div>
                    <div>
                        <strong>ليلى حسن</strong>
                        <p>5 أصدقاء مشتركين</p>
                    </div>
                    <button class="btn-follow" onclick="toggleFollow(this)">+ متابعة</button>
                </div>
                <div class="friend-suggestion">
                    <div class="avatar-small">ع</div>
                    <div>
                        <strong>عمر يوسف</strong>
                        <p>3 أصدقاء مشتركين</p>
                    </div>
                    <button class="btn-follow" onclick="toggleFollow(this)">+ متابعة</button>
                </div>
            </div>

            <div class="widget">
                <h3>الأكثر نشاطاً</h3>
                <ul class="trending">
                    <li>#تصميم_ويب</li>
                    <li>#البرمجة</li>
                    <li>#Safonee</li>
                    <li>#تطوير</li>
                </ul>
            </div>
        </aside>
    </div>

    <script>
        let currentImage = null;

        window.onload = function() {
            loadPosts();
        };

        // ضغط الصورة قبل الحفظ
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // تحديد الحجم الأقصى
                    const maxWidth = 800;
                    const maxHeight = 800;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // ضغط بجودة 70%
                    const compressed = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressed);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                compressImage(file, function(compressed) {
                    currentImage = compressed;
                    document.getElementById('previewImg').src = compressed;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                });
            }
        }

        function removeImage() {
            currentImage = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        function createPost() {
            var input = document.getElementById('postInput');
            var content = input.value.trim();
            
            if (content || currentImage) {
                var posts = JSON.parse(localStorage.getItem('safonee_posts') || '[]');
                
                var newPost = {
                    id: Date.now(),
                    content: content,
                    image: currentImage,
                    author: 'أنت',
                    time: 'الآن',
                    likes: 0,
                    liked: false,
                    comments: []
                };
                
                posts.unshift(newPost);
                localStorage.setItem('safonee_posts', JSON.stringify(posts));
                
                input.value = '';
                removeImage();
                loadPosts();
            } else {
                alert('اكتب شيئاً أو أضف صورة! ✍️');
            }
        }

        function loadPosts() {
            var posts = JSON.parse(localStorage.getItem('safonee_posts') || '[]');
            var container = document.getElementById('postsContainer');
            container.innerHTML = '';
            
            if (posts.length === 0) {
                posts = [
                    {
                        id: 1,
                        content: 'يوم رائع للتعلم واكتشاف أشياء جديدة في عالم البرمجة! 💻✨',
                        image: null,
                        author: 'سارة العلي',
                        time: 'منذ ساعتين',
                        likes: 5,
                        liked: false,
                        comments: []
                    },
                    {
                        id: 2,
                        content: 'من يريد تعلم تصميم المواقع بلغة HTML و CSS؟ يمكنني مساعدتكم! 🚀',
                        image: null,
                        author: 'محمد خالد',
                        time: 'منذ 5 ساعات',
                        likes: 12,
                        liked: false,
                        comments: []
                    }
                ];
                localStorage.setItem('safonee_posts', JSON.stringify(posts));
            }
            
            posts.forEach(function(post) {
                var imageHTML = '';
                if (post.image) {
                    imageHTML = `
                        <div class="post-image-container">
                            <img src="${post.image}" class="post-image" onclick="openImageModal('${post.image}')">
                        </div>
                    `;
                }
                
                var postHTML = `
                    <article class="post">
                        <div class="post-header">
                            <div class="avatar-small">${post.author.charAt(0)}</div>
                            <div class="post-info">
                                <h4>${post.author}</h4>
                                <span>${post.time} · 🌍</span>
                            </div>
                        </div>
                        ${post.content ? `<p class="post-content">${post.content}</p>` : ''}
                        ${imageHTML}
                        <div class="comments-section" id="comments-${post.id}">
                            ${post.comments.map(c => `<div class="comment"><strong>${c.author}:</strong> ${c.text}</div>`).join('')}
                        </div>
                        <div class="post-actions">
                            <button onclick="toggleLike(${post.id})" style="${post.liked ? 'background:#6366f1;color:white;' : ''}">
                                ❤️ ${post.liked ? 'أعجبني' : 'إعجاب'} (${post.likes})
                            </button>
                            <button onclick="toggleComments(${post.id})">
                                💬 تعليق (${post.comments.length})
                            </button>
                            <button onclick="sharePost(${post.id})">🔗 مشاركة</button>
                        </div>
                        <div class="comment-input" id="commentInput-${post.id}" style="display:none;">
                            <input type="text" placeholder="اكتب تعليقاً..." id="commentText-${post.id}">
                            <button onclick="addComment(${post.id})">إرسال</button>
                        </div>
                    </article>
                `;
                container.innerHTML += postHTML;
            });
            
            document.getElementById('postCount').textContent = posts.length;
        }

        function openImageModal(src) {
            var modal = document.createElement('div');
            modal.className = 'image-modal';
            modal.onclick = function() { this.remove(); };
            modal.innerHTML = `
                <span class="close-modal">✕</span>
                <img src="${src}" style="max-width:90%; max-height:90%; border-radius:12px;">
            `;
            document.body.appendChild(modal);
        }

        function toggleLike(postId) {
            var posts = JSON.parse(localStorage.getItem('safonee_posts') || '[]');
            var post = posts.find(p => p.id === postId);
            
            if (post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                localStorage.setItem('safonee_posts', JSON.stringify(posts));
                loadPosts();
            }
        }

        function toggleComments(postId) {
            var commentInput = document.getElementById('commentInput-' + postId);
            commentInput.style.display = commentInput.style.display === 'none' ? 'block' : 'none';
        }

        function addComment(postId) {
            var input = document.getElementById('commentText-' + postId);
            var text = input.value.trim();
            
            if (text) {
                var posts = JSON.parse(localStorage.getItem('safonee_posts') || '[]');
                var post = posts.find(p => p.id === postId);
                
                if (post) {
                    post.comments.push({ author: 'أنت', text: text });
                    localStorage.setItem('safonee_posts', JSON.stringify(posts));
                    loadPosts();
                }
            }
        }

        function sharePost(postId) {
            alert('تم نسخ رابط المنشور! 🔗');
        }

        function toggleFollow(btn) {
            if (btn.textContent.includes('+')) {
                btn.textContent = '✓ متابعة';
                btn.style.background = '#6366f1';
                btn.style.color = 'white';
            } else {
                btn.textContent = '+ متابعة';
                btn.style.background = '#f5f5f7';
                btn.style.color = '#2d2d30';
            }
        }

        function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                sessionStorage.removeItem('loggedIn');
                window.location.href = 'index.html';
            }
        }
                function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <style>
        .post-input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .post-options {
            display: flex;
            gap: 8px;
        }
        .option-btn {
            background: #f5f5f7;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #6366f1;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .option-btn:hover {
            background: #e8e8ec;
        }
        .post-image-container {
            margin: 15px 0;
            border-radius: 12px;
            overflow: hidden;
        }
        .post-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .post-image:hover {
            transform: scale(1.02);
        }
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .comment {
            background: #f5f5f7;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        .comment-input {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e8e8ec;
        }
        .comment-input input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d1d1d6;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .comment-input button {
            padding: 8px 16px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</body>
</html>
